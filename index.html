<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>點餐小助手</title>
  
  <!-- 載入 Tailwind CSS 用於美化 -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- 載入 React 和 ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- 載入 Babel 以便在瀏覽器中編譯 JSX -->
  <script src="https://unpkg.com/@babel/standalone@7.23.6/babel.min.js"></script>
  
  <style>
    /* 皮克敏搖擺動畫 */
    @keyframes wiggle {
      0%, 100% { transform: rotate(-3deg); }
      50% { transform: rotate(3deg); }
    }
    .pikmin-wiggle:hover {
      animation: wiggle 0.5s ease-in-out infinite;
    }
    /* 草地背景紋理 */
    .bg-grass {
      background-color: #f0fdf4;
      background-image: radial-gradient(#dcfce7 20%, transparent 20%), radial-gradient(#dcfce7 20%, transparent 20%);
      background-size: 20px 20px;
      background-position: 0 0, 10px 10px;
    }
  </style>
</head>
<body class="bg-grass font-sans text-stone-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // ============================================================================
    // ⚠️ 您的 Google Apps Script URL
    // ============================================================================
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx9HLXBILdN2VO0T28pu5xj33dt0dlMHL-8BD9hEICpdA9St-mEHEMU-2S9puyZ1iZzZg/exec";

    // ============================================================================
    // 🏷️ 應用程式版本號設定
    // ============================================================================
    const APP_VERSION = "YS1.4";

    function App() {
      const today = new Date().toISOString().split('T')[0];
      const isLineBrowser = navigator.userAgent.includes('Line') || navigator.userAgent.includes('LINE');

      const [formData, setFormData] = useState({
        nickname: '',
        date: today,
        noFood: false,
        foodName: '',
        foodPrice: '',
        foodPortion: '正常',
        foodSpiciness: '不調整',
        noMushroom: false,
        foodNote: '',
        noDrink: false,
        drinkName: '',
        drinkPrice: '',
        drinkSweetness: '無糖',
        drinkIce: '去冰',
        drinkNote: ''
      });

      const [status, setStatus] = useState('idle');
      const [errorMessage, setErrorMessage] = useState('');
      const [almanac, setAlmanac] = useState({ yi: '', ji: '' });

      // 產生今日宜忌 (以日期為種子，每天固定)
      useEffect(() => {
        const good = ["大口吃肉", "喝手搖飲", "準時下班", "點外送", "加珍珠", "嚐鮮", "請客", "吃甜點", "吃飽睡好"];
        const bad = ["減肥", "加班", "餓肚子", "選擇困難", "吃太少", "忘記拿餐", "算卡路里", "踩雷", "猶豫不決"];
        const d = new Date();
        const seed = d.getFullYear() + d.getMonth() + d.getDate();
        setAlmanac({
          yi: good[seed % good.length],
          ji: bad[seed % bad.length]
        });
      }, []);

      const handleInputChange = (e) => {
        const { name, value, type, checked } = e.target;
        const inputValue = type === 'checkbox' ? checked : value;
        setFormData(prev => ({ ...prev, [name]: inputValue }));
        setErrorMessage('');
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        
        let finalNickname = formData.nickname.trim();

        // 彩蛋：魔法少女
        if (finalNickname === "。") {
          finalNickname = "魔法少女小圓☆";
        }

        // 仙女模式
        const isFairy = formData.noFood && formData.noDrink;
        if (isFairy) {
          finalNickname = `${finalNickname}-今天當仙女`;
        }

        if (!finalNickname) {
          setErrorMessage("請填寫暱稱！");
          return;
        }

        // 必填防呆強化
        if (!isFairy) {
          if (!formData.noFood && !formData.foodName.trim()) {
            setErrorMessage("您沒有勾選「不吃」，請告訴我們您想吃什麼喔！(請填寫品名)");
            return;
          }
          if (!formData.noDrink && !formData.drinkName.trim()) {
            setErrorMessage("您沒有勾選「不喝」，請告訴我們您想喝什麼喔！(請填寫品名)");
            return;
          }
        }

        setStatus('submitting');

        const now = new Date();
        const timestamp = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

        const finalFoodName = formData.noFood ? '不吃' : (formData.foodName || '');
        const finalFoodPrice = formData.noFood ? 0 : (Number(formData.foodPrice) || 0);
        const finalFoodPortion = formData.noFood ? '' : formData.foodPortion;
        const finalFoodSpiciness = formData.noFood ? '' : formData.foodSpiciness;
        const finalNoMushroom = formData.noFood ? '' : (formData.noMushroom ? '不菇' : '');
        const finalFoodNote = formData.noFood ? '' : (formData.foodNote || '');

        const finalDrinkName = formData.noDrink ? '不喝' : (formData.drinkName || '');
        const finalDrinkPrice = formData.noDrink ? 0 : (Number(formData.drinkPrice) || 0);
        const finalDrinkSweetnessIce = formData.noDrink ? '' : `${formData.drinkSweetness}-${formData.drinkIce}`;
        const finalDrinkNote = formData.noDrink ? '' : (formData.drinkNote || '');
        
        const totalAmount = finalFoodPrice + finalDrinkPrice;

        const payload = {
          timestamp,
          nickname: finalNickname,
          date: formData.date,
          foodName: finalFoodName,
          foodPrice: finalFoodPrice,
          foodPortion: finalFoodPortion,
          foodSpiciness: finalFoodSpiciness,
          noMushroom: finalNoMushroom,  
          foodNote: finalFoodNote,
          drinkName: finalDrinkName,
          drinkPrice: finalDrinkPrice,
          drinkSweetnessIce: finalDrinkSweetnessIce,
          drinkNote: finalDrinkNote,
          totalAmount
        };

        if (GOOGLE_SCRIPT_URL === "YOUR_GOOGLE_SCRIPT_WEB_APP_URL_HERE") {
          setTimeout(() => {
            setStatus('success');
          }, 1000);
          return;
        }

        try {
          const fetchUrl = GOOGLE_SCRIPT_URL + "?t=" + new Date().getTime();
          await fetch(fetchUrl, {
            method: 'POST',
            mode: 'no-cors',
            cache: 'no-cache',      
            redirect: 'follow',     
            headers: {
              'Content-Type': 'text/plain;charset=utf-8', 
            },
            body: JSON.stringify(payload)
          });
          
          setStatus('success');
        } catch (error) {
          console.error("送出失敗:", error);
          setStatus('error');
        }
      };

      const resetForm = () => {
        setFormData({
          nickname: '',
          date: today,
          noFood: false,
          foodName: '',
          foodPrice: '',
          foodPortion: '正常',
          foodSpiciness: '不調整',
          noMushroom: false,
          foodNote: '',
          noDrink: false,
          drinkName: '',
          drinkPrice: '',
          drinkSweetness: '無糖',
          drinkIce: '去冰',
          drinkNote: ''
        });
        setStatus('idle');
        setErrorMessage('');
      };

      return (
        <div className="min-h-screen py-8 px-4 flex flex-col items-center">
          <div className="w-full max-w-4xl bg-white/90 backdrop-blur-sm rounded-3xl shadow-2xl overflow-hidden border-4 border-lime-600/30 relative">
            
            {/* 標題區塊 - 森林綠皮克敏風 */}
            <div className="bg-lime-600 p-8 text-center relative overflow-hidden">
              <div className="absolute top-0 left-0 w-full h-full opacity-10 pointer-events-none">
                <svg width="100" height="100" fill="white" xmlns="http://www.w3.org/2000/svg">
                  <path d="M50 15 Q60 5 70 15 Q75 30 50 50 Q25 30 30 15 Q40 5 50 15Z" />
                </svg>
              </div>
              
              <a 
                href="https://docs.google.com/spreadsheets/d/1wumef4klvsfJg3x1pr9ul9H9hFGaP9vQrDydlKEuG84/edit?gid=0#gid=0" 
                target="_blank" 
                rel="noopener noreferrer" 
                className="absolute top-4 right-4 text-lime-100 hover:text-white hover:scale-110 transition-all drop-shadow-md z-20 flex flex-col items-center gap-1 pikmin-wiggle"
                title="查看試算表後台"
              >
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-6 h-6"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><line x1="3" x2="21" y1="9" y2="9"/><line x1="9" x2="9" y1="9" y2="21"/></svg>
                <span className="text-[10px] font-bold">後台</span>
              </a>

              <h1 className="text-4xl font-black text-white mb-3 relative z-10 flex items-center justify-center gap-3 drop-shadow-md">
                {/* 紅皮克敏大頭娃娃圖示 */}
                <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 100 100" fill="none">
                  <path d="M50 50 Q45 20 50 10" stroke="#a3e635" strokeWidth="6" fill="none" strokeLinecap="round"/>
                  <path d="M50 10 C30 -5, 40 -15, 50 0 C60 -15, 70 -5, 50 10 Z" fill="#a3e635"/>
                  <ellipse cx="50" cy="75" rx="28" ry="20" fill="#ef4444"/>
                  <circle cx="35" cy="70" r="8" fill="white"/>
                  <circle cx="65" cy="70" r="8" fill="white"/>
                  <circle cx="35" cy="70" r="3" fill="black"/>
                  <circle cx="65" cy="70" r="3" fill="black"/>
                </svg>
                點餐小助手
              </h1>
              
              {/* 🌟 農民曆彩蛋 */}
              <div className="inline-block bg-white/20 rounded-full px-6 py-2 border border-lime-400/50 backdrop-blur-md relative z-10">
                <p className="text-lime-50 text-sm font-medium tracking-wide">
                  📅 今日宜：<span className="text-yellow-200 font-bold">{almanac.yi}</span> ｜ 忌：<span className="text-red-200 font-bold">{almanac.ji}</span>
                </p>
              </div>
              <p className="text-lime-800 text-xs text-right relative z-10 font-bold mt-2 opacity-80">
                by夜綠素 version:{APP_VERSION}
              </p>
            </div>

            {isLineBrowser && status !== 'success' && (
              <div className="bg-yellow-50 text-yellow-800 px-4 py-3 text-sm flex items-start gap-3 border-b border-yellow-200">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="shrink-0 mt-0.5 text-yellow-600"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" x2="12" y1="9" y2="13"/><line x1="12" x2="12.01" y1="17" y2="17"/></svg>
                <p className="font-medium">
                  您目前使用 LINE 內建瀏覽器，若發生送出失敗，建議點擊右上角 <strong>⠇</strong> 改用 <strong>Safari / Chrome</strong> 開啟喔！
                </p>
              </div>
            )}

            {status === 'success' ? (
              <div className="p-10 text-center flex flex-col items-center justify-center min-h-[400px]">
                <div className="text-lime-500 mb-6 animate-bounce">
                    <svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/><path d="m9 12 2 2 4-4"/></svg>
                </div>
                <h2 className="text-3xl font-black text-stone-700 mb-2">餐點搬運中！</h2>
                <p className="text-stone-500 mb-8 font-medium">您的點餐資訊已交給皮克敏處理。</p>
                <button 
                  onClick={resetForm}
                  className="px-8 py-3 bg-lime-100 text-lime-700 font-bold rounded-full hover:bg-lime-200 transition-colors shadow-sm"
                >
                  再點一份
                </button>
              </div>
            ) : (
              <form onSubmit={handleSubmit} className="p-6 md:p-10 flex flex-col gap-8">
                
                {/* 橫跨整欄的基本資訊 */}
                <section className="bg-stone-50 p-6 rounded-2xl border-2 border-stone-200 shadow-sm relative group">
                  <h2 className="text-lg font-bold text-stone-700 border-b-2 border-stone-200 pb-2 mb-4 flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-lime-600"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    基本資訊
                  </h2>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div className="space-y-1">
                      <label className="block text-sm font-bold text-stone-600">暱稱 <span className="text-red-500">*</span></label>
                      <input
                        type="text"
                        name="nickname"
                        placeholder="請輸入暱稱"
                        value={formData.nickname}
                        onChange={handleInputChange}
                        className="w-full px-4 py-3 rounded-xl border-2 border-stone-200 focus:ring-4 focus:ring-lime-500/20 focus:border-lime-500 transition-all outline-none bg-white font-medium"
                      />
                    </div>
                    <div className="space-y-1">
                      <label className="block text-sm font-bold text-stone-600">開動日期</label>
                      <input
                        type="date"
                        name="date"
                        value={formData.date}
                        onChange={handleInputChange}
                        className="w-full px-4 py-3 rounded-xl border-2 border-stone-200 focus:ring-4 focus:ring-lime-500/20 focus:border-lime-500 transition-all outline-none bg-white font-medium"
                      />
                    </div>
                  </div>
                </section>

                {/* 雙欄排版：吃的 & 喝的 */}
                <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                  
                  {/* 吃的區塊 */}
                  <section className={`relative p-6 rounded-2xl border-2 transition-all duration-500 group 
                    ${formData.noFood ? 'bg-stone-100 border-stone-200' : 'bg-orange-50/70 border-orange-200 shadow-[0_4px_20px_-10px_rgba(251,146,60,0.3)]'}`}>
                    
                    {/* 黃色皮克敏 SVG (大耳朵) */}
                    <div className={`absolute -top-12 right-2 w-16 transition-all duration-500 origin-bottom 
                      ${formData.noFood ? 'opacity-40 grayscale rotate-[70deg] translate-y-4' : 'group-hover:-translate-y-2 group-hover:rotate-6'}`}>
                      <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M50 40 Q55 25 50 15" stroke="#65a30d" strokeWidth="2" fill="none" strokeLinecap="round"/>
                        <ellipse cx="50" cy="12" rx="3.5" ry="5" fill="#facc15" stroke="#ca8a04" strokeWidth="1"/>
                        <path d="M42 45 Q20 30 25 50 Q30 55 42 50" fill="#facc15"/>
                        <path d="M58 45 Q80 30 75 50 Q70 55 58 50" fill="#facc15"/>
                        <path d="M42 70 C42 50, 58 50, 58 70 C58 80, 42 80, 42 70 Z" fill="#facc15"/>
                        <ellipse cx="50" cy="46" rx="11" ry="14" fill="#facc15"/>
                        <circle cx="44" cy="42" r="4.5" fill="white"/>
                        <circle cx="56" cy="42" r="4.5" fill="white"/>
                        <circle cx="44" cy="42" r="1.5" fill="black"/>
                        <circle cx="56" cy="42" r="1.5" fill="black"/>
                      </svg>
                    </div>

                    <div className="flex items-center justify-between border-b-2 border-orange-200/60 pb-3 mb-5">
                      <h2 className={`text-xl font-black flex items-center gap-2 ${formData.noFood ? 'text-stone-400' : 'text-orange-700'}`}>
                        🍔 吃的
                      </h2>
                      <div className={`flex items-center gap-2 px-3 py-1.5 rounded-lg border-2 transition-colors cursor-pointer
                        ${formData.noFood ? 'bg-orange-100 border-orange-300' : 'bg-white border-orange-200'}`}>
                        <input
                          type="checkbox" id="noFood" name="noFood" checked={formData.noFood} onChange={handleInputChange}
                          className="w-4 h-4 text-orange-500 rounded focus:ring-orange-500 cursor-pointer accent-orange-500"
                        />
                        <label htmlFor="noFood" className="text-sm font-bold text-stone-700 cursor-pointer select-none">不吃</label>
                      </div>
                    </div>
                    
                    <div className={`space-y-4 transition-all duration-300 ${formData.noFood ? 'opacity-20 pointer-events-none' : 'opacity-100'}`}>
                      <div className="grid grid-cols-3 gap-3">
                        <div className="space-y-1 col-span-2">
                          <label className="block text-xs font-bold text-stone-500">品名</label>
                          <input type="text" name="foodName" placeholder="如：排骨便當" value={formData.foodName} onChange={handleInputChange}
                            className="w-full px-4 py-2.5 rounded-xl border-2 border-orange-100 focus:border-orange-400 outline-none bg-white font-medium shadow-sm" />
                        </div>
                        <div className="space-y-1 col-span-1">
                          <label className="block text-xs font-bold text-stone-500">金額</label>
                          <input type="number" name="foodPrice" min="0" placeholder="0" value={formData.foodPrice} onChange={handleInputChange}
                            className="w-full px-4 py-2.5 rounded-xl border-2 border-orange-100 focus:border-orange-400 outline-none bg-white font-medium shadow-sm" />
                        </div>
                      </div>
                      
                      <div className="grid grid-cols-2 gap-3">
                        <div className="space-y-1">
                          <label className="block text-xs font-bold text-stone-500">份量</label>
                          <select name="foodPortion" value={formData.foodPortion} onChange={handleInputChange}
                            className="w-full px-4 py-2.5 rounded-xl border-2 border-orange-100 focus:border-orange-400 outline-none bg-white font-medium shadow-sm">
                            <option value="正常">正常</option><option value="飯少">飯少</option><option value="半飯">半飯</option>
                            <option value="加飯">加飯</option><option value="麵少">麵少</option><option value="加麵">加麵</option>
                          </select>
                        </div>
                        <div className="space-y-1">
                          <label className="block text-xs font-bold text-stone-500">辣度</label>
                          <select name="foodSpiciness" value={formData.foodSpiciness} onChange={handleInputChange}
                            className="w-full px-4 py-2.5 rounded-xl border-2 border-orange-100 focus:border-orange-400 outline-none bg-white font-medium shadow-sm">
                            <option value="不調整">不調整</option><option value="不辣">不辣</option><option value="微辣">微辣</option>
                            <option value="小辣">小辣</option><option value="中辣">中辣</option><option value="大辣">大辣</option>
                          </select>
                        </div>
                      </div>

                      <div className="flex items-center gap-2 p-2 bg-white/50 rounded-lg border border-orange-100">
                        <input type="checkbox" id="noMushroom" name="noMushroom" checked={formData.noMushroom} onChange={handleInputChange}
                          className="w-5 h-5 text-orange-500 rounded focus:ring-orange-500 cursor-pointer accent-orange-500" />
                        <label htmlFor="noMushroom" className="text-sm font-bold text-stone-600 cursor-pointer select-none">
                          不菇 (不要任何菇類) 🍄❌
                        </label>
                      </div>
                      
                      <div className="space-y-1">
                        <label className="block text-xs font-bold text-stone-500">備註 (選填)</label>
                        <input type="text" name="foodNote" placeholder="例如：不要香菜" value={formData.foodNote} onChange={handleInputChange}
                          className="w-full px-4 py-2.5 rounded-xl border-2 border-orange-100 focus:border-orange-400 outline-none bg-white font-medium shadow-sm" />
                      </div>
                    </div>
                  </section>

                  {/* 喝的區塊 */}
                  <section className={`relative p-6 rounded-2xl border-2 transition-all duration-500 group 
                    ${formData.noDrink ? 'bg-stone-100 border-stone-200' : 'bg-sky-50/70 border-sky-200 shadow-[0_4px_20px_-10px_rgba(14,165,233,0.3)]'}`}>
                    
                    {/* 藍色皮克敏 SVG (嘟嘟嘴) */}
                    <div className={`absolute -top-12 right-2 w-16 transition-all duration-500 origin-bottom 
                      ${formData.noDrink ? 'opacity-40 grayscale rotate-[70deg] translate-y-4' : 'group-hover:scale-110 group-hover:-rotate-3'}`}>
                      <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M50 42 Q45 25 50 15" stroke="#65a30d" strokeWidth="2" fill="none" strokeLinecap="round"/>
                        <path d="M50 15 C40 10, 45 0, 50 0 C55 0, 60 10, 50 15 Z" fill="#65a30d"/>
                        <path d="M42 70 C42 50, 58 50, 58 70 C58 80, 42 80, 42 70 Z" fill="#3b82f6"/>
                        <ellipse cx="50" cy="48" rx="10" ry="13" fill="#3b82f6"/>
                        <circle cx="44" cy="44" r="4.5" fill="white"/>
                        <circle cx="56" cy="44" r="4.5" fill="white"/>
                        <circle cx="44" cy="44" r="1.5" fill="black"/>
                        <circle cx="56" cy="44" r="1.5" fill="black"/>
                        <ellipse cx="50" cy="56" rx="4" ry="4" fill="#1e3a8a"/>
                        <ellipse cx="50" cy="56" rx="2" ry="2" fill="#bfdbfe"/>
                      </svg>
                    </div>

                    <div className="flex items-center justify-between border-b-2 border-sky-200/60 pb-3 mb-5">
                      <h2 className={`text-xl font-black flex items-center gap-2 ${formData.noDrink ? 'text-stone-400' : 'text-sky-700'}`}>
                        🧋 喝的
                      </h2>
                      <div className={`flex items-center gap-2 px-3 py-1.5 rounded-lg border-2 transition-colors cursor-pointer
                        ${formData.noDrink ? 'bg-sky-100 border-sky-300' : 'bg-white border-sky-200'}`}>
                        <input
                          type="checkbox" id="noDrink" name="noDrink" checked={formData.noDrink} onChange={handleInputChange}
                          className="w-4 h-4 text-sky-500 rounded focus:ring-sky-500 cursor-pointer accent-sky-500"
                        />
                        <label htmlFor="noDrink" className="text-sm font-bold text-stone-700 cursor-pointer select-none">不喝</label>
                      </div>
                    </div>
                    
                    <div className={`space-y-4 transition-all duration-300 ${formData.noDrink ? 'opacity-20 pointer-events-none' : 'opacity-100'}`}>
                      <div className="grid grid-cols-3 gap-3">
                        <div className="space-y-1 col-span-2">
                          <label className="block text-xs font-bold text-stone-500">品名</label>
                          <input type="text" name="drinkName" placeholder="如：珍珠奶茶" value={formData.drinkName} onChange={handleInputChange}
                            className="w-full px-4 py-2.5 rounded-xl border-2 border-sky-100 focus:border-sky-400 outline-none bg-white font-medium shadow-sm" />
                        </div>
                        <div className="space-y-1 col-span-1">
                          <label className="block text-xs font-bold text-stone-500">金額</label>
                          <input type="number" name="drinkPrice" min="0" placeholder="0" value={formData.drinkPrice} onChange={handleInputChange}
                            className="w-full px-4 py-2.5 rounded-xl border-2 border-sky-100 focus:border-sky-400 outline-none bg-white font-medium shadow-sm" />
                        </div>
                      </div>
                      
                      <div className="grid grid-cols-2 gap-3">
                        <div className="space-y-1">
                          <label className="block text-xs font-bold text-stone-500">甜度</label>
                          <select name="drinkSweetness" value={formData.drinkSweetness} onChange={handleInputChange}
                            className="w-full px-4 py-2.5 rounded-xl border-2 border-sky-100 focus:border-sky-400 outline-none bg-white font-medium shadow-sm">
                            <option value="正常糖">正常糖</option><option value="少糖">少糖</option><option value="半糖">半糖</option>
                            <option value="微糖">微糖</option><option value="一分糖">一分糖</option><option value="無糖">無糖</option>
                          </select>
                        </div>
                        <div className="space-y-1">
                          <label className="block text-xs font-bold text-stone-500">冰塊</label>
                          <select name="drinkIce" value={formData.drinkIce} onChange={handleInputChange}
                            className="w-full px-4 py-2.5 rounded-xl border-2 border-sky-100 focus:border-sky-400 outline-none bg-white font-medium shadow-sm">
                            <option value="正常冰">正常冰</option><option value="少冰">少冰</option><option value="微冰">微冰</option>
                            <option value="去冰">去冰</option><option value="完全去冰">完全去冰</option><option value="常溫">常溫</option><option value="熱">熱</option>
                          </select>
                        </div>
                      </div>

                      <div className="space-y-1">
                        <label className="block text-xs font-bold text-stone-500">備註 (選填)</label>
                        <input type="text" name="drinkNote" placeholder="例如：換燕麥奶" value={formData.drinkNote} onChange={handleInputChange}
                          className="w-full px-4 py-2.5 rounded-xl border-2 border-sky-100 focus:border-sky-400 outline-none bg-white font-medium shadow-sm" />
                      </div>
                    </div>
                  </section>
                </div>

                {/* 提交區塊 (含錯誤提示) */}
                <div className="space-y-4 pt-4">
                  {errorMessage && (
                    <div className="bg-red-100 text-red-700 px-6 py-4 rounded-xl text-sm font-bold flex items-center justify-center gap-2 border-2 border-red-200 animate-bounce shadow-md">
                      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>
                      {errorMessage}
                    </div>
                  )}

                  {/* 確保按鈕與皮克敏包裹在同一個相對定位容器中 */}
                  <div className="relative group mt-6">
                    {/* 紅色皮克敏 SVG (緊緊趴在按鈕上方緣) */}
                    <div className="absolute -top-10 left-1/2 -translate-x-1/2 w-16 transition-transform duration-300 group-hover:-translate-y-1.5 z-20 pointer-events-none drop-shadow-sm">
                      <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M50 35 Q45 20 50 15" stroke="#65a30d" strokeWidth="2" fill="none" strokeLinecap="round"/>
                        <circle cx="45" cy="12" r="3" fill="white"/>
                        <circle cx="55" cy="12" r="3" fill="white"/>
                        <circle cx="47" cy="7" r="3" fill="white"/>
                        <circle cx="53" cy="7" r="3" fill="white"/>
                        <circle cx="50" cy="16" r="3" fill="white"/>
                        <circle cx="50" cy="11" r="2.5" fill="#facc15"/>
                        <path d="M42 65 C42 45, 58 45, 58 65 C58 75, 42 75, 42 65 Z" fill="#ef4444"/>
                        <ellipse cx="50" cy="43" rx="10" ry="14" fill="#ef4444"/>
                        <path d="M50 45 L70 48 L50 51 Z" fill="#ef4444"/>
                        <circle cx="45" cy="38" r="4.5" fill="white"/>
                        <circle cx="55" cy="38" r="4.5" fill="white"/>
                        <circle cx="45" cy="38" r="1.5" fill="black"/>
                        <circle cx="55" cy="38" r="1.5" fill="black"/>
                        {/* 加長手臂，往下緊緊抓住按鈕 */}
                        <path d="M38 60 Q25 70 32 85" stroke="#ef4444" strokeWidth="3" strokeLinecap="round" fill="none"/>
                        <path d="M62 60 Q75 70 68 85" stroke="#ef4444" strokeWidth="3" strokeLinecap="round" fill="none"/>
                      </svg>
                    </div>

                    <button
                      type="submit"
                      disabled={status === 'submitting'}
                      className={`w-full py-4 rounded-2xl font-black text-xl text-white shadow-xl flex items-center justify-center gap-2 transition-all relative z-10 overflow-hidden
                        ${status === 'submitting' 
                          ? 'bg-lime-500 cursor-not-allowed' 
                          : 'bg-lime-600 hover:bg-lime-500 hover:shadow-lime-500/40'}`}
                    >
                      {status === 'submitting' ? (
                        <span className="flex items-center gap-2">
                          <svg className="animate-spin h-6 w-6 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                            <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                          </svg>
                          皮克敏搬運中...
                        </span>
                      ) : (
                        <>
                          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="22" x2="11" y1="2" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                          交給皮克敏送出！
                        </>
                      )}
                    </button>
                  </div>
                </div>
              </form>
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
